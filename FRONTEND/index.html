<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoServe - Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SECTION -->
        <div class="login-left">

            <div class="brand">
                <div class="logo">🌱</div>
                <h1>EcoServe</h1>
            </div>

            <h2>
                Complaint Management & Analytics Portal
            </h2>

            <p>
                Report environmental issues, track complaints,
                and help create a cleaner and healthier community.
            </p>

            <div class="environment-icons">
                <span>🌱</span>
                <span>♻️</span>
                <span>🌍</span>
                <span>💧</span>
            </div>

        </div>


        <!-- RIGHT SECTION -->
        <div class="login-right">

            <div class="login-card">

                <h2>Welcome Back!</h2>

                <p class="login-subtitle">
                    Login to continue to EcoServe
                </p>


                <!-- LOGIN FORM -->
                <form onsubmit="event.preventDefault(); loginUser();">

                    <!-- EMAIL -->
                    <div class="mb-3">

                        <label for="email" class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            required>

                    </div>


                    <!-- PASSWORD -->
                    <div class="mb-3">

                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            required>

                    </div>


                    <!-- OPTIONS -->
                    <div class="login-options">

                        <div>
                            <input
                                type="checkbox"
                                id="remember">

                            <label for="remember">
                                Remember me
                            </label>
                        </div>

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button
                        type="submit"
                        class="login-btn">
                        Login
                    </button>

                </form>


                <!-- MESSAGE -->
                <div id="loginMessage"></div>


                <!-- REGISTER -->
                <div class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/login.js"></script>

</body>

</html>
