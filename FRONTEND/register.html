<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - EcoServe</title>

    <link rel="stylesheet"
          href="css/register.css">

</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                🌱
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join EcoServe and help build a cleaner environment.
            </p>


            <form onsubmit="event.preventDefault(); registerUser()"></form>

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the terms and conditions
                    </span>

                </div>

                <button type="button" onclick="registerUser()">
    Create Account
</button>

            </form>


            <p id="message"></p>


            <p class="login-text">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="./js/register.js"></script>

</body>

</html>
